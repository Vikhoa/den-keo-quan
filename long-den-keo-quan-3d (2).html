<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Bản vẽ 3D lồng đèn kéo quân</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0b3b73;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff}
  canvas{display:block;touch-action:none;cursor:grab}
  canvas:active{cursor:grabbing}
  #title{position:fixed;top:10px;left:12px;right:12px;pointer-events:none}
  #title h1{margin:0;font-size:14px;font-weight:700;letter-spacing:.4px}
  #title p{margin:3px 0 0;font-size:11px;opacity:.75}
  #legend{position:fixed;top:56px;left:12px;font-size:12px;line-height:1.5;background:rgba(7,40,84,.82);border:1px solid rgba(170,210,255,.5);border-radius:6px;max-width:80vw}
  #lgHead{padding:6px 11px;font-weight:700;color:#bfe0ff;cursor:pointer;user-select:none}
  #lgBody{padding:0 11px 8px;pointer-events:none}
  #legend.collapsed #lgBody{display:none}
  #legend b{color:#bfe0ff}
  #legend small{display:block;opacity:.65;margin-top:4px;font-size:10px}
  #ui{position:fixed;left:0;right:0;bottom:12px;display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 10px;pointer-events:none}
  #ui>*{pointer-events:auto}
  #bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
  #ui.collapsed #bar{display:none}
  button{background:rgba(255,255,255,.1);border:1px solid rgba(190,220,255,.5);color:#fff;padding:8px 12px;border-radius:999px;font-size:13px;cursor:pointer}
  button.on{background:#2f8cf0;border-color:#9cc9ff}
  button:active{transform:scale(.96)}
  #bMenu{background:rgba(7,40,84,.85);font-size:12px;padding:5px 14px}
</style>
</head>
<body>
<div id="title"><h1>BẢN VẼ 3D – LỒNG ĐÈN KÉO QUÂN</h1><p>Kéo để xoay · Lăn chuột / chụm hai ngón để zoom</p></div>
<div id="legend"><div id="lgHead">▾ Thông số</div><div id="lgBody"></div></div>
<div id="ui">
  <button id="bMenu">▾ Thu gọn nút</button>
  <div id="bar">
    <button id="bDim" class="on">Kích thước</button>
    <button id="bAuto">Tự xoay</button>
    <button id="bFan">Quạt quay</button>
    <button id="bMica" class="on">Ruột nhựa</button>
    <button id="bExp">Tách rời</button>
    <button id="bReset">Đặt lại</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  // 1 đơn vị trong mô hình = UNIT_CM cm (chỉnh số này nếu kích thước thật khác)
  var UNIT_CM = 10;

  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0b3b73);

  var renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);
  var canvasEl = renderer.domElement;

  var camera = new THREE.PerspectiveCamera(40, window.innerWidth/window.innerHeight, 0.1, 100);

  // ---------- Kích thước ----------
  var R = 1.0;
  var APO = R*Math.cos(Math.PI/6);
  var W = R, H = 2.0, T = 0.075, D = 0.045, LEG = 0.18;
  var TOP = LEG + H;
  var EX = 0.9, LIFT = 1.3; // độ dịch khi tách rời
  function cm(u){ var v = u*UNIT_CM; return (Math.round(v*10)/10).toString().replace('.',',') + ' cm'; }

  // ---------- Ánh sáng ----------
  scene.add(new THREE.AmbientLight(0xffffff, 0.55));
  var key = new THREE.DirectionalLight(0xffffff, 0.7); key.position.set(3,5,4); scene.add(key);
  var key2 = new THREE.DirectionalLight(0xaad0ff, 0.35); key2.position.set(-4,2,-3); scene.add(key2);

  // ---------- Lưới bản vẽ ----------
  var grid = new THREE.GridHelper(14, 56, 0x7fb4ee, 0x2b66a8);
  grid.position.y = -0.002;
  scene.add(grid);

  // ---------- Vật liệu ----------
  var frameMat = new THREE.MeshStandardMaterial({color:0x3d82cc, roughness:0.8});
  var foamMat  = new THREE.MeshStandardMaterial({color:0x5b9be0, roughness:0.9});
  var woodMat  = new THREE.MeshStandardMaterial({color:0xe0c080, roughness:0.8});
  var bladeMat = new THREE.MeshStandardMaterial({color:0x9cc9f5, roughness:0.8, side:THREE.DoubleSide});
  var edgeMat  = new THREE.LineBasicMaterial({color:0xffffff, transparent:true, opacity:0.9});
  var paperMat = new THREE.MeshStandardMaterial({color:0xeaf4ff, roughness:0.9, transparent:true, opacity:0.35, side:THREE.DoubleSide, depthWrite:false});

  function edges(mesh, angle){
    mesh.add(new THREE.LineSegments(new THREE.EdgesGeometry(mesh.geometry, angle||20), edgeMat));
    return mesh;
  }

  var lantern = new THREE.Group();
  scene.add(lantern);
  var panelInners = [];
  var cy = LEG + H/2;

  // ---------- 6 mặt khung (giấy để trống) ----------
  for(var i=0;i<6;i++){
    var outer = new THREE.Group();
    outer.rotation.y = i*Math.PI/3;
    var inner = new THREE.Group();
    inner.position.z = APO;
    outer.add(inner);

    var post = new THREE.BoxGeometry(T, H+LEG, D);
    var pl = edges(new THREE.Mesh(post, frameMat)); pl.position.set(-(W/2-T/2), cy-LEG/2, 0);
    var pr = edges(new THREE.Mesh(post, frameMat)); pr.position.set((W/2-T/2), cy-LEG/2, 0);
    var bar = new THREE.BoxGeometry(W-2*T, T, D);
    var bt = edges(new THREE.Mesh(bar, frameMat)); bt.position.set(0, cy+H/2-T/2, 0);
    var bb = edges(new THREE.Mesh(bar, frameMat)); bb.position.set(0, cy-H/2+T/2, 0);
    inner.add(pl,pr,bt,bb);

    var paper = new THREE.Mesh(new THREE.PlaneGeometry(W-2*T+0.02, H-2*T+0.02), paperMat);
    paper.position.set(0, cy, 0);
    inner.add(paper);

    lantern.add(outer);
    panelInners.push(inner);
  }

  // ---------- Đế foam + nến ----------
  var base = edges(new THREE.Mesh(new THREE.CylinderGeometry(R*0.98,R*0.98,0.04,6), foamMat));
  base.rotation.y = Math.PI/6; base.position.y = LEG+0.02;
  lantern.add(base);

  var candle = new THREE.Group();
  candle.position.y = LEG+0.04;
  var cup = new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.08,0.07,32),
    new THREE.MeshStandardMaterial({color:0xdfe6ee, metalness:0.6, roughness:0.4}));
  cup.position.y = 0.035;
  var wax = new THREE.Mesh(new THREE.CylinderGeometry(0.085,0.085,0.06,32),
    new THREE.MeshStandardMaterial({color:0xfff4d6}));
  wax.position.y = 0.05;
  candle.add(cup,wax);
  lantern.add(candle);

  // ---------- Phần nắp trên ----------
  var topGroup = new THREE.Group();
  lantern.add(topGroup);

  var shape = new THREE.Shape();
  for(var k=0;k<6;k++){
    var a = k*Math.PI/3;
    var x = R*Math.cos(a), y = R*Math.sin(a);
    if(k===0) shape.moveTo(x,y); else shape.lineTo(x,y);
  }
  shape.closePath();
  var hole = new THREE.Path(); hole.absarc(0,0,0.72,0,Math.PI*2,true);
  shape.holes.push(hole);
  var plate = edges(new THREE.Mesh(new THREE.ExtrudeGeometry(shape,{depth:0.04,bevelEnabled:false}), foamMat), 30);
  plate.rotation.x = -Math.PI/2;
  plate.position.y = TOP;
  topGroup.add(plate);

  var cross = edges(new THREE.Mesh(new THREE.BoxGeometry(1.7,0.025,0.1), foamMat));
  cross.position.y = TOP - 0.0125;
  topGroup.add(cross);

  var stick = new THREE.Mesh(new THREE.CylinderGeometry(0.014,0.014,0.5,12), woodMat);
  stick.position.y = TOP + 0.2;
  topGroup.add(stick);
  var button = new THREE.Mesh(new THREE.SphereGeometry(0.035,16,16),
    new THREE.MeshStandardMaterial({color:0xffd966, metalness:0.5, roughness:0.4}));
  button.position.y = TOP + 0.46;
  topGroup.add(button);

  var fan = new THREE.Group();
  fan.position.y = TOP + 0.12;
  fan.add(edges(new THREE.Mesh(new THREE.CylinderGeometry(0.07,0.07,0.04,24), foamMat)));
  var ring = new THREE.Mesh(new THREE.RingGeometry(0.72,0.8,64), bladeMat);
  ring.rotation.x = -Math.PI/2;
  fan.add(ring);
  var N = 18;
  for(var b=0;b<N;b++){
    var pivot = new THREE.Group();
    pivot.rotation.y = b*2*Math.PI/N;
    var blade = edges(new THREE.Mesh(new THREE.BoxGeometry(0.66,0.008,0.17), bladeMat));
    blade.position.x = 0.42;
    blade.rotation.x = 0.8;
    pivot.add(blade);
    fan.add(pivot);
  }
  topGroup.add(fan);

  // Ruột nhựa mica
  var micaH = H*0.9;
  var mica = new THREE.Mesh(
    new THREE.CylinderGeometry(0.72,0.72,micaH,64,1,true),
    new THREE.MeshStandardMaterial({color:0xcfe8ff, transparent:true, opacity:0.14, side:THREE.DoubleSide, depthWrite:false})
  );
  mica.position.y = TOP - micaH/2 - 0.02;
  lantern.add(mica);

  // ---------- Đường kích thước (tự bám theo khi tách rời) ----------
  var dims = new THREE.Group();
  scene.add(dims);
  var V = THREE.Vector3;
  var DIMCOL = 0xffe066;
  var lineMat = new THREE.LineBasicMaterial({color:DIMCOL, transparent:true, opacity:0.65, depthTest:false});

  function makeLabel(text){
    var c = document.createElement('canvas'); c.width = 512; c.height = 96;
    var g = c.getContext('2d');
    g.fillStyle = 'rgba(7,40,84,0.9)'; g.fillRect(0,0,512,96);
    g.strokeStyle = '#ffe066'; g.lineWidth = 3; g.strokeRect(1.5,1.5,509,93);
    g.fillStyle = '#ffe066';
    g.font = 'bold 40px system-ui, Arial, sans-serif';
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(text, 256, 50);
    var s = new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c), depthTest:false, transparent:true}));
    s.scale.set(1.15, 0.215, 1);
    s.renderOrder = 20;
    return s;
  }
  function makeSeg(){
    var g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(6),3));
    var l = new THREE.Line(g, lineMat);
    l.frustumCulled = false; l.renderOrder = 10;
    dims.add(l);
    return l;
  }
  function setSeg(l, p, q){
    var arr = l.geometry.attributes.position.array;
    arr[0]=p.x; arr[1]=p.y; arr[2]=p.z; arr[3]=q.x; arr[4]=q.y; arr[5]=q.z;
    l.geometry.attributes.position.needsUpdate = true;
  }
  function makeArrow(){
    var ar = new THREE.ArrowHelper(new V(1,0,0), new V(), 1, DIMCOL, 0.1, 0.05);
    ar.line.material.depthTest = false; ar.cone.material.depthTest = false;
    ar.line.renderOrder = 10; ar.cone.renderOrder = 10;
    ar.line.frustumCulled = false;
    dims.add(ar);
    return ar;
  }
  var dimList = [];
  function addDim(text, fn, labOff){
    var d = {fn:fn, e1:makeSeg(), e2:makeSeg(), a1:makeArrow(), a2:makeArrow(), lab:makeLabel(text), labOff:labOff||new V()};
    dims.add(d.lab);
    dimList.push(d);
  }
  function updateDims(e){
    for(var i=0;i<dimList.length;i++){
      var d = dimList[i], pts = d.fn(e);
      var n = pts.off.clone().normalize().multiplyScalar(0.06);
      var a = pts.p1.clone().add(pts.off), b = pts.p2.clone().add(pts.off);
      setSeg(d.e1, pts.p1, a.clone().add(n));
      setSeg(d.e2, pts.p2, b.clone().add(n));
      var mid = a.clone().add(b).multiplyScalar(0.5);
      var dir = b.clone().sub(a), len = dir.length(); dir.normalize();
      d.a1.position.copy(mid); d.a1.setDirection(dir.clone().negate()); d.a1.setLength(len/2, 0.1, 0.05);
      d.a2.position.copy(mid); d.a2.setDirection(dir);                  d.a2.setLength(len/2, 0.1, 0.05);
      d.lab.position.copy(mid).add(d.labOff);
    }
  }

  // Cao tổng (bên phải) – đầu trên đi theo phần nắp khi tách rời
  addDim('Cao ' + cm(TOP), function(e){
    return {p1:new V(R,0,0), p2:new V(R,TOP+LIFT*e,0), off:new V(0.6+0.6*e,0,0)};
  });
  // Cao khung – bám theo mặt trước
  addDim('Khung ' + cm(H), function(e){
    return {p1:new V(-W/2,LEG,APO+EX*e), p2:new V(-W/2,TOP,APO+EX*e), off:new V(-0.45,0,0.2)};
  });
  // Rộng mặt – bám theo mặt trước
  addDim('Rộng ' + cm(W), function(e){
    return {p1:new V(-W/2,0,APO+EX*e), p2:new V(W/2,0,APO+EX*e), off:new V(0,0,0.55)};
  });
  // Đường kính đỉnh–đỉnh (đế cố định)
  addDim('Ø đỉnh-đỉnh ' + cm(2*R), function(e){
    return {p1:new V(-R,0,0), p2:new V(R,0,0), off:new V(0,0,-1.35)};
  });
  // Đối cạnh (đế cố định)
  addDim('Đối cạnh ' + cm(2*APO), function(e){
    return {p1:new V(0,0,-APO), p2:new V(0,0,APO), off:new V(-1.75,0,0)};
  });
  // Quạt – nâng theo nắp
  addDim('Quạt Ø' + cm(1.6), function(e){
    return {p1:new V(-0.8,TOP+0.12+LIFT*e,0), p2:new V(0.8,TOP+0.12+LIFT*e,0), off:new V(0,0.5,0)};
  }, new V(0,0.2,0));
  updateDims(0);

  // Bảng thông số
  var items = [
    ['Cao tổng (cả chân)', TOP], ['Cao khung mặt', H], ['Rộng mỗi mặt', W],
    ['Ø đỉnh–đỉnh', 2*R], ['Ø đối cạnh', 2*APO], ['Ø quạt', 1.6], ['Cao chân', LEG]
  ];
  document.getElementById('lgBody').innerHTML =
    items.map(function(it){ return '<b>' + it[0] + ':</b> ' + cm(it[1]); }).join('<br>') +
    '<small>Ước tính, số đo theo trạng thái lắp ráp (1 đơn vị = ' + UNIT_CM + ' cm)</small>';

  // ---------- Điều khiển xoay / zoom ----------
  var target = new THREE.Vector3(0, 1.2, 0);
  function defRadius(){
    var asp = window.innerWidth/window.innerHeight;
    return clamp(2.6/(Math.tan(20*Math.PI/180)*asp), 8.5, 20);
  }
  function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
  var def = {theta:0.7, phi:1.15, r:defRadius()};
  var theta = def.theta, phi = def.phi, radius = def.r;
  var vTheta = 0, vPhi = 0, targetRadius = radius;
  var autoRotate = false;
  var pointers = {};
  var lastPinch = 0;
  var MAXR = 26;

  canvasEl.addEventListener('pointerdown', function(e){
    canvasEl.setPointerCapture(e.pointerId);
    pointers[e.pointerId] = {x:e.clientX, y:e.clientY};
    var ids = Object.keys(pointers);
    if(ids.length===2){
      var p = pointers[ids[0]], q = pointers[ids[1]];
      lastPinch = Math.hypot(p.x-q.x, p.y-q.y);
    }
    vTheta = vPhi = 0;
  });
  canvasEl.addEventListener('pointermove', function(e){
    var p = pointers[e.pointerId];
    if(!p) return;
    var ids = Object.keys(pointers);
    if(ids.length===1){
      var dx = e.clientX - p.x, dy = e.clientY - p.y;
      theta -= dx*0.008; phi = clamp(phi - dy*0.008, 0.1, Math.PI-0.1);
      vTheta = -dx*0.008; vPhi = -dy*0.008;
      p.x = e.clientX; p.y = e.clientY;
    } else if(ids.length===2){
      p.x = e.clientX; p.y = e.clientY;
      var a = pointers[ids[0]], c2 = pointers[ids[1]];
      var d = Math.hypot(a.x-c2.x, a.y-c2.y);
      if(lastPinch>0){ targetRadius = clamp(targetRadius * (lastPinch/d), 2.5, MAXR); }
      lastPinch = d;
    }
  });
  function up(e){ delete pointers[e.pointerId]; lastPinch = 0; }
  canvasEl.addEventListener('pointerup', up);
  canvasEl.addEventListener('pointercancel', up);
  canvasEl.addEventListener('wheel', function(e){
    e.preventDefault();
    targetRadius = clamp(targetRadius * Math.exp(e.deltaY*0.0012), 2.5, MAXR);
  }, {passive:false});

  // ---------- Nút ----------
  var fanOn = false, explode = 0, explodeTarget = 0;
  function toggle(id, fn){
    var el = document.getElementById(id);
    el.addEventListener('click', function(){ fn(el); });
  }
  var legend = document.getElementById('legend');
  // mặc định thu gọn bảng thông số trên màn hình nhỏ
  if(window.innerWidth < 700){ legend.classList.add('collapsed'); document.getElementById('lgHead').textContent = '▸ Thông số'; }
  document.getElementById('lgHead').addEventListener('click', function(){
    var c = legend.classList.toggle('collapsed');
    this.textContent = (c ? '▸' : '▾') + ' Thông số';
  });
  var ui = document.getElementById('ui');
  toggle('bMenu', function(el){
    var c = ui.classList.toggle('collapsed');
    el.textContent = c ? '▴ Hiện nút' : '▾ Thu gọn nút';
  });
  toggle('bDim', function(el){
    dims.visible = !dims.visible; el.classList.toggle('on', dims.visible);
    legend.style.display = dims.visible ? 'block' : 'none';
  });
  toggle('bAuto', function(el){ autoRotate = !autoRotate; el.classList.toggle('on', autoRotate); });
  toggle('bFan', function(el){ fanOn = !fanOn; el.classList.toggle('on', fanOn); });
  toggle('bMica', function(el){ mica.visible = !mica.visible; el.classList.toggle('on', mica.visible); });
  toggle('bExp', function(el){ explodeTarget = explodeTarget?0:1; el.classList.toggle('on', !!explodeTarget); });
  toggle('bReset', function(){ def.r = defRadius(); theta = def.theta; phi = def.phi; targetRadius = def.r; vTheta = vPhi = 0; });

  // ---------- Vòng lặp ----------
  var fanSpeed = 0, t0 = performance.now();
  function animate(now){
    requestAnimationFrame(animate);
    var dt = Math.min((now - t0)/1000, 0.05); t0 = now;

    if(Object.keys(pointers).length===0){
      theta += vTheta; phi = clamp(phi + vPhi, 0.1, Math.PI-0.1);
      vTheta *= 0.93; vPhi *= 0.93;
      if(autoRotate) theta += dt*0.35;
    }
    radius += (targetRadius - radius)*0.15;
    camera.position.set(
      target.x + radius*Math.sin(phi)*Math.sin(theta),
      target.y + radius*Math.cos(phi),
      target.z + radius*Math.sin(phi)*Math.cos(theta)
    );
    camera.lookAt(target);

    fanSpeed += ((fanOn?2.6:0) - fanSpeed)*0.03;
    fan.rotation.y += fanSpeed*dt;

    explode += (explodeTarget - explode)*0.1;
    for(var j=0;j<panelInners.length;j++) panelInners[j].position.z = APO + explode*EX;
    topGroup.position.y = explode*LIFT;
    mica.position.y = TOP - micaH/2 - 0.02 + explode*LIFT/2;
    if(dims.visible) updateDims(explode);

    renderer.render(scene, camera);
  }
  requestAnimationFrame(animate);

  window.addEventListener('resize', function(){
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
})();
</script>
</body>
</html>
